<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- High-Vibrancy Brand Red Gradient -->
    <linearGradient id="vibrant-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Pitch Black Background Badge -->
  <rect width="512" height="512" rx="96" fill="#000000" />

  <!-- Pure Intense Bright Red Kufic ALAM Monogram -->
  <g>
    <!-- Base Bounding Box for Monogram (x: 48 to 464, y: 112 to 400) -->
    <rect x="48" y="112" width="416" height="288" fill="url(#vibrant-red)" rx="2" />

    <!-- BLACK CUTOUTS -->
    <!-- 1. Hole in 1st A -->
    <rect x="80" y="144" width="32" height="32" fill="#000000" />

    <!-- 2. Hollow space under 1st A crossbar -->
    <rect x="80" y="208" width="32" height="96" fill="#000000" />

    <!-- 3. Top Dip between 1st A and 2nd A -->
    <rect x="144" y="112" width="32" height="160" fill="#000000" />

    <!-- 4. Hole in 2nd A -->
    <rect x="208" y="144" width="32" height="32" fill="#000000" />

    <!-- 5. Hollow space under 2nd A crossbar -->
    <rect x="208" y="208" width="32" height="96" fill="#000000" />

    <!-- 6. Vertical Slot 1 in M -->
    <rect x="272" y="144" width="32" height="160" fill="#000000" />

    <!-- 7. Vertical Slot 2 in M -->
    <rect x="336" y="144" width="32" height="160" fill="#000000" />

    <!-- 8. Vertical Slot 3 in M -->
    <rect x="400" y="144" width="32" height="160" fill="#000000" />

    <!-- 9. Horizontal Black Channel above bottom border -->
    <rect x="80" y="336" width="352" height="32" fill="#000000" />
  </g>
</svg>
