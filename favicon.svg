<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Red Color -->
    <linearGradient id="brand-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Pitch Black Background Badge -->
  <rect width="512" height="512" rx="96" fill="#000000" />

  <!-- Exact Red Kufic ALAM Monogram (Original 1:1 Geometry) -->
  <g>
    <!-- Base Red Bounding Box -->
    <rect x="48" y="112" width="416" height="288" fill="url(#brand-red)" rx="2" />

    <!-- EXACT BLACK CUTOUTS (No middle lines) -->
    <!-- 1. Square hole in 1st letter -->
    <rect x="80" y="144" width="32" height="32" fill="#000000" />

    <!-- 2. Top Dip between 1st and 2nd letter -->
    <rect x="144" y="112" width="32" height="160" fill="#000000" />

    <!-- 3. Square hole in 2nd letter -->
    <rect x="208" y="144" width="32" height="32" fill="#000000" />

    <!-- 4. Vertical Slot 1 in M -->
    <rect x="272" y="144" width="32" height="160" fill="#000000" />

    <!-- 5. Vertical Slot 2 in M -->
    <rect x="336" y="144" width="32" height="160" fill="#000000" />

    <!-- 6. Vertical Slot 3 in M -->
    <rect x="400" y="144" width="32" height="160" fill="#000000" />

    <!-- 7. Bottom Horizontal Black Channel -->
    <rect x="80" y="336" width="352" height="32" fill="#000000" />
  </g>
</svg>
