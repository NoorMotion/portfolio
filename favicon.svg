<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Brand Red Gradient -->
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Subtle Red Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="512" height="512" rx="96" fill="url(#bg-grad)" stroke="#27272A" stroke-width="8" />

  <!-- Stylized Red Kufic ALAM Monogram -->
  <g filter="url(#glow)">
    <!-- Base Bounding Box for Monogram (x: 48 to 464, y: 112 to 400) -->
    <rect x="48" y="112" width="416" height="288" fill="url(#red-grad)" rx="4" />

    <!-- BLACK CUTOUTS -->
    <!-- 1. Hole in 1st A -->
    <rect x="80" y="144" width="32" height="32" fill="#000000" />

    <!-- 2. Hollow space under 1st A crossbar -->
    <rect x="80" y="208" width="32" height="96" fill="#000000" />

    <!-- 3. Top Dip between 1st A and 2nd A -->
    <rect x="144" y="112" width="32" height="160" fill="#000000" />

    <!-- 4. Hole in 2nd A -->
    <rect x="208" y="144" width="32" height="32" fill="#000000" />

    <!-- 5. Hollow space under 2nd A crossbar -->
    <rect x="208" y="208" width="32" height="96" fill="#000000" />

    <!-- 6. Vertical Slot 1 in M -->
    <rect x="272" y="144" width="32" height="160" fill="#000000" />

    <!-- 7. Vertical Slot 2 in M -->
    <rect x="336" y="144" width="32" height="160" fill="#000000" />

    <!-- 8. Vertical Slot 3 in M -->
    <rect x="400" y="144" width="32" height="160" fill="#000000" />

    <!-- 9. Horizontal Black Channel above bottom border -->
    <rect x="80" y="336" width="352" height="32" fill="#000000" />
  </g>
</svg>
